<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURSOS SELECIONADOS | .FILTER()</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>


<body>
    <header>
        <h1>SELETOR DE CURSOS</h1>
    </header>

    <main>
        <section id="menu">
            <h3>Nome do curso</h3>
            <div id="campoResultado"></div>

            <div id="adicionar">Adicionar</div>
            <div id="remover">Remover curso</div>
            <div id="cursoSelecionado">Curso selecionado</div>

            <div id="displayVetores"></div>
        </section>


        <section id="opcoes">
            <div class="curso">
                <label for="radioo1">HTML / CSS</label>
                <input type="radio" name="rad" id="radioo1">
            </div>

            <div class="curso">
                <label for="radioo2">JavaScript</label>
                <input type="radio" name="rad" id="radioo2">
            </div>

            <div class="curso">
                <label for="radioo3">Git / GitHub</label>
                <input type="radio" name="rad" id="radioo3">
            </div>

            <div class="curso">
                <label for="radioo4">PHP</label>
                <input type="radio" name="rad" id="radioo4">
            </div>
            
            <div class="curso">
                <label for="radioo5">Python</label>
                <input type="radio" name="rad" id="radioo5">
            </div>

            <div id="removerTodos">Remover todos os cursos</div>
        </section>
    </main>

    <script src="script/script.js"></script>
</body>
</html>
